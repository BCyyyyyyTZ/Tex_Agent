[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 自动将项目根目录加入 sys.path，无需手动设置 PYTHONPATH
pythonpath = .
markers =
    integration: 需要 chromadb + 本地 embedding 的集成测试（可用 -m "not integration" 排除）
    latex_integration: 需要本机 chktex/latexmk 的 LaTeX 集成测试
    slow: 较慢或需完整依赖的测试（如 LangGraph 端到端）
